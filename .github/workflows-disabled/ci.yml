name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static validation (data, i18n, html/js ids)
        run: npm run validate

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Smoke test (all tabs and trainer modes)
        run: xvfb-run --auto-servernum npx electron smoke-test.js
